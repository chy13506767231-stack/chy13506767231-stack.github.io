<!DOCTYPE html>
<!-- github-pages auto-sync build 2026-08-05 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>木木酱の工作台</title>
<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
<script src="https://unpkg.com/docx-preview/dist/docx-preview.min.js"></script>
<style>
:root{
  --bg:#f4f7fa; --card:#fff; --text:#4a4a52; --t2:#8793a5; --t3:#aab3c2;
  --pri:#9BB9D8;
  --blue-50:#E1EAF3; --blue:#C2D8EB; --blue-d:#9BB9D8;
  --pink-50:#F5E5EE; --pink:#EAC2D6; --pink-d:#C98FA9;
  --green:#C2D8EB;           /* 旧别名 -> 蓝 */
  --green-light:#eef4fa;     /* 旧别名 -> 浅蓝 */
  --border:#e1e7ee; --shadow:0 2px 12px rgba(128,178,229,.05); --shadow-md:0 4px 20px rgba(128,178,229,.08);
  --radius:16px; --radius-sm:12px;
  --blue1:var(--blue-50); --blue2:var(--blue); --blue3:var(--blue-d);
  --pink1:var(--pink-50); --pink2:var(--pink); --muted:var(--t2);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background-color:var(--bg);color:var(--text);font-size:14px;line-height:1.6;max-width:100%;margin:0 auto;padding:0 18px;min-height:100vh;background-image:radial-gradient(circle at 18px 18px,rgba(155,185,216,.13) 3px,transparent 4px),radial-gradient(circle at 58px 42px,rgba(234,194,214,.14) 3px,transparent 4px);background-size:84px 84px;background-attachment:fixed}

/* ===== Header ===== */
.header{background:linear-gradient(135deg,#9BB9D8,#C2D8EB 42%,#F0E3EA 78%,#EAC2D6);padding:22px 24px 18px;color:#fff;position:relative;overflow:hidden}
.header::after{content:"";position:absolute;top:-50px;right:-30px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.05)}
.header-greeting{font-size:12px;opacity:.8}
.header-name{font-size:22px;font-weight:800;margin-top:2px}
.header-sub{font-size:11px;opacity:.7;margin-top:4px;letter-spacing:1px}
.header-photo{width:56px;height:56px;border-radius:50%;overflow:hidden;border:2px solid rgba(255,255,255,.35);flex-shrink:0;background:rgba(255,255,255,.1)}
.header-photo img{width:100%;height:100%;object-fit:cover}
.sanrio-row{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.sanrio-tag{font-size:11px;background:rgba(255,255,255,.28);padding:5px 12px;border-radius:14px;backdrop-filter:blur(2px);font-weight:600;white-space:normal;line-height:1.4;text-align:left;max-width:460px;cursor:pointer;border:none;font-family:inherit;color:#fff;text-shadow:0 1px 3px rgba(50,40,60,.55);box-shadow:0 2px 8px rgba(50,40,60,.28);transition:all .15s}
.sanrio-tag:hover{background:rgba(255,255,255,.42);transform:translateY(-1px);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.sanrio-tag.has-today::after{content:"✓";color:#bfe8c8;margin-left:5px;font-size:10px;font-weight:800}
.sanrio-refresh{white-space:nowrap}
/* ===== 每日运势/注意 浮层（点开位置就地展开，不跳页尾） ===== */
.daily-pop{position:fixed;z-index:80;width:344px;max-width:92vw;max-height:72vh;overflow:auto;background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:0 18px 50px rgba(74,68,87,.22);animation:dpin .12s ease-out}
@keyframes dpin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.daily-pop-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 14px;border-bottom:1px solid var(--border);font-weight:700;font-size:13px;position:sticky;top:0;background:var(--card);border-radius:14px 14px 0 0}
.daily-pop-bd{padding:12px 14px}
.daily-stars{display:flex;flex-wrap:wrap;gap:6px 16px;margin-bottom:10px}
.daily-stars>div{font-size:13px}
.daily-tip{font-size:13px;line-height:1.75;background:#fafbf7;border:1px solid #eef0e8;border-radius:8px;padding:10px 12px;white-space:pre-wrap}
.daily-long{font-size:13px;line-height:1.7;margin-top:8px;white-space:pre-wrap;color:var(--t1)}
.daily-hist{margin-top:12px;border-top:1px dashed var(--border);padding-top:8px}
.daily-hist>div.hd{font-size:11px;color:var(--t2);font-weight:600;margin-bottom:6px}
.daily-hist .item{font-size:12px;padding:6px 9px;margin-bottom:4px;background:#fafbf7;border-radius:7px;border:1px solid #eef0e8}
.daily-hist .item .dt{font-size:11px;color:var(--t2);font-weight:600;margin-bottom:2px}
.sanrio-refresh{font-size:11px;background:rgba(255,255,255,.16);padding:3px 11px;border-radius:999px;border:1px dashed rgba(255,255,255,.5);backdrop-filter:blur(2px);font-weight:600;white-space:nowrap;cursor:pointer;color:#fff;font-family:inherit;transition:all .15s}
.sanrio-refresh:hover{background:rgba(255,255,255,.32);transform:translateY(-1px)}
.header-name .bow{margin-right:5px}
.pipeline-bar{display:flex;gap:4px;margin-top:16px;flex-wrap:wrap;position:relative;z-index:1}
.pipeline-dot{flex:1;min-width:60px;text-align:center;padding:7px 3px;background:rgba(255,255,255,.12);border-radius:10px;font-size:10px;font-weight:500;opacity:.85;cursor:pointer;transition:background .15s}
.pipeline-dot:hover{background:rgba(255,255,255,.22)}
.pipeline-dot .cnt{display:inline-block;min-width:14px;padding:0 3px;margin-left:2px;background:rgba(255,255,255,.25);border-radius:7px;font-size:9px}

/* ===== 布局：左侧 Tab 边栏 + 右侧内容（蓝粉主题：未点=蓝，点了=粉） ===== */
.layout{display:flex;align-items:flex-start;gap:18px;margin-top:10px}
.tab-nav{display:flex;flex-direction:column;flex:0 0 172px;width:172px;background:linear-gradient(180deg,#fff,#fbfdff);border:1px solid var(--border);border-radius:14px;padding:8px;gap:4px;position:sticky;top:10px;max-height:calc(100vh - 20px);overflow-y:auto;align-self:flex-start}
.tab-nav::-webkit-scrollbar{width:4px}
.tab-nav::-webkit-scrollbar-thumb{background:var(--blue-d);border-radius:2px}
.tab-btn{flex:0 0 auto;width:100%;padding:11px 12px;border:none;background:none;font-size:12px;color:var(--blue-d);cursor:pointer;font-weight:600;position:relative;white-space:nowrap;text-align:left;border-radius:12px;transition:all .18s;margin:0}
.tab-btn:hover{background:var(--blue-50);color:#6a8fb0}
.tab-btn.active{background:var(--pink-50);color:var(--pink-d);font-weight:800;box-shadow:0 2px 8px rgba(234,194,214,.32)}
.tab-btn.active::after{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;background:var(--pink);border-radius:2px}
/* 窄屏（手机）自动回到顶部横向 TAB 栏，保证可用性 */
@media (max-width:760px){
  .layout{flex-direction:column;gap:10px}
  .tab-nav{flex:1 1 auto;width:100%;flex-direction:row;flex-wrap:nowrap;overflow-x:auto;position:static;max-height:none}
  .tab-btn{width:auto;flex:0 0 auto;text-align:center;padding:9px 12px}
  .tab-btn.active::after{left:auto;top:auto;bottom:4px;left:50%;transform:translateX(-50%);width:18px;height:3px}
}

/* ===== hello AI（外接大模型 · 页面内对话） ===== */
.ai-bar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ai-bar-title{font-weight:700;color:var(--blue3);font-size:15px}
.ai-sel{flex:1;min-width:0;padding:7px 10px;border:1px solid var(--blue2);border-radius:8px;font-size:13px;background:#fff;color:var(--blue3);cursor:pointer}
.ai-cfg-toggle{white-space:nowrap;padding:7px 12px;border:1px solid var(--blue3);border-radius:8px;background:#fff;color:var(--blue3);font-size:13px;cursor:pointer;font-weight:600}
.ai-cfg-toggle:hover{background:var(--blue3);color:#fff}
.ai-set{background:var(--blue1);border-radius:var(--radius-sm);margin-top:14px;overflow:hidden}
.ai-set-head{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;cursor:pointer;font-size:13px;font-weight:700;color:var(--blue3)}
.ai-set-head:hover{background:var(--blue2)}
.ai-chev{font-size:12px;color:var(--muted)}
.ai-set.collapsed{padding:0}
.ai-set-body{padding:4px 16px 14px}
.ai-cfg-collapsed{padding:6px 0;font-size:12.5px;color:var(--muted)}
.ai-cfg-list{margin:6px 0}
.ai-cfg-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border:1px solid var(--blue2);border-radius:8px;margin:6px 0;background:#fff}
.ai-cfg-item.active{border-color:var(--blue3);box-shadow:0 0 0 2px rgba(155,185,216,.35)}
.ai-cfg-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.ai-cfg-meta b{color:var(--blue3)}
.ai-cfg-meta span{font-size:11.5px;color:var(--muted)}
.ai-cfg-tag{font-size:11px;color:#7a2f55;background:var(--pink1);border-radius:10px;padding:1px 7px}
.ai-cfg-acts{display:flex;gap:6px;align-items:center;flex-shrink:0}
.ai-cur{font-size:12px;color:#3a7d44;font-weight:700}
.ai-cfg-form{margin-top:10px;border-top:1px dashed var(--blue2);padding-top:10px}
.ai-cfg-formtitle{font-size:13px;font-weight:700;color:var(--blue3);margin-bottom:8px}
.ai-set .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:7px 0}
.ai-set input{flex:1;min-width:160px;padding:8px 10px;border:1px solid var(--blue2);border-radius:8px;font-size:13px;background:#fff}
.ai-set label{font-size:12.5px;color:var(--muted);min-width:62px}
.ai-preset{font-size:12px;padding:4px 10px;border:1px solid var(--blue3);border-radius:20px;background:#fff;color:var(--blue3);cursor:pointer}
.ai-preset:hover{background:var(--blue3);color:#fff}
.ai-msgs{max-height:46vh;overflow-y:auto;padding:6px 2px;margin-bottom:12px}
.ai-msg{margin:10px 0;display:flex}
.ai-msg.user{justify-content:flex-end}
.ai-bubble{max-width:80%;padding:10px 13px;border-radius:14px;font-size:13.5px;white-space:pre-wrap;word-break:break-word;line-height:1.6}
.ai-msg.user .ai-bubble{background:linear-gradient(160deg,var(--blue3),#8aa9cc);color:#fff;border-bottom-right-radius:4px}
.ai-msg.assistant .ai-bubble{background:#fff;border:1px solid var(--blue2);border-bottom-left-radius:4px}
.ai-input{display:flex;gap:10px;align-items:flex-end}
.ai-input textarea{flex:1;min-height:54px;max-height:150px;resize:vertical;padding:10px;border:1px solid var(--blue2);border-radius:10px;font-size:13.5px;font-family:inherit}
.ai-input button{padding:10px 18px;border:none;border-radius:10px;background:var(--pink2);color:#7a2f55;font-weight:700;cursor:pointer}
.ai-input button.ghost{background:transparent;border:1px solid var(--blue3);color:var(--blue3)}
.ai-hint{font-size:12px;color:var(--muted);margin-top:6px}

/* ===== Layout ===== */
.panels{padding:16px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.stat-card{background:var(--card);border-radius:var(--radius-sm);padding:16px 18px;box-shadow:var(--shadow);position:relative}
.stat-card::before{content:"";position:absolute;top:0;left:0;width:4px;height:100%;border-radius:2px 0 0 2px}
.stat-card.s-green::before{background:var(--green)}
.stat-card.s-pink::before{background:var(--pink)}
.stat-card.s-blue::before{background:var(--pri)}
.stat-card .label{font-size:11px;color:var(--t2);margin-bottom:4px;font-weight:500}
.stat-card .value{font-size:28px;font-weight:800;line-height:1}
.card{background:var(--card);border-radius:var(--radius-sm);padding:16px 18px;box-shadow:var(--shadow);margin-bottom:10px}
.card-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.card-title{font-size:14px;font-weight:700}

/* ===== Controls ===== */
.btn{padding:7px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-size:11px;font-weight:500;transition:all .15s;color:var(--text)}
.btn:hover{background:#f5f2f0}
.btn-primary{background:var(--green);color:#fff;border-color:var(--green)}
.btn-pink{background:var(--pink);color:#fff;border-color:var(--pink)}
.btn-sm{padding:4px 8px;font-size:10px}
.btn-ghost{background:none;border:none;color:var(--t2);padding:4px 6px;cursor:pointer;font-size:11px}
.btn-ghost-danger{color:#c98895}
input,textarea,select{border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12px;font-family:inherit;background:var(--card);color:var(--text);outline:none;width:100%}
input:focus,textarea:focus,select:focus{border-color:var(--blue-d);box-shadow:0 0 0 3px rgba(128,178,229,.18)}
textarea{resize:vertical;min-height:70px}
.badge{display:inline-flex;padding:2px 8px;border-radius:8px;font-size:9px;font-weight:600}
.badge-green{background:var(--green-light);color:#5e7f9b}
.badge-pink{background:#f5edf1;color:#9b7d8a}
.badge-blue{background:#e8ecf2;color:#6b7d94}
.badge-gray{background:#f0eeec;color:#888}

/* ===== Modal ===== */
.modal-bg{position:fixed;inset:0;background:rgba(74,68,87,.3);backdrop-filter:blur(4px);z-index:50;display:flex;align-items:center;justify-content:center}
.modal{background:var(--card);border-radius:16px;padding:20px 24px;width:480px;max-width:92vw;max-height:80vh;overflow-y:auto;box-shadow:0 20px 60px rgba(74,68,87,.1)}
.modal h3{font-size:16px;font-weight:700;margin-bottom:14px}
.fg{margin-bottom:10px}
.fg label{display:block;font-size:10px;font-weight:600;color:var(--t2);margin-bottom:3px}
.fg .hint{font-size:10px;color:var(--green);margin-top:3px;font-weight:400}

/* ===== Utils ===== */
.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.row-end{justify-content:flex-end}
.row-between{justify-content:space-between}
.gap-4{gap:4px}
.mt-12{margin-top:12px}
.mb-8{margin-bottom:8px}
.mb-12{margin-bottom:12px}
.flex1{flex:1;min-width:0}
.sh0{flex-shrink:0}
.text-xs{font-size:11px;color:var(--t3)}
.text-line{text-decoration:line-through;opacity:.4}
.text-pre{white-space:pre-wrap}
.fw-600{font-weight:600}
.fw-700{font-weight:700}
.empty{color:var(--t3);font-size:12px;text-align:center;padding:32px 0}

/* ===== TODO ===== */
.todo-row{display:block;padding:9px 0;border-bottom:1px solid #f0eeec}
.todo-item{display:flex;align-items:center;gap:8px}
.todo-item input[type=checkbox]{width:17px;height:17px;accent-color:var(--green);flex-shrink:0}
.todo-note{margin-top:6px;padding:6px 8px;font-size:12px;line-height:1.5;color:#5b6b5f;background:#f3f7f1;border-left:3px solid var(--green);border-radius:6px;white-space:pre-wrap;word-break:break-all}

/* ===== TODO 面板专属：莫兰迪绿主题（去蓝） ===== */
.theme-morandi{
  --blue-50:#E8EDE5; --blue:#BFCAB8; --blue-d:#7E9279;
  --green:#7E9279;           /* 复原本意：勾选色 = 莫兰迪绿 */
  --green-light:#E8EDE5;
  --border:#C8D2C0; --shadow:0 2px 12px rgba(126,146,121,.10); --shadow-md:0 4px 20px rgba(126,146,121,.13);
  background:linear-gradient(180deg,#EFF2EB 0%,#E3E8DC 100%);
  border-radius:var(--radius);
  padding:14px 16px;
  margin:-6px -4px;
  border:1px solid #D6DDCB;
}
.theme-morandi .card{background:#FAFBF7;border-color:#D6DDCB;box-shadow:0 2px 10px rgba(126,146,121,.06)}
.theme-morandi .card-hd{border-bottom-color:#DDE3D2}
.theme-morandi .btn-primary{background:#7E9279;color:#fff;border-color:#7E9279}
.theme-morandi .btn-primary:hover{background:#6B7E66;border-color:#6B7E66}
.theme-morandi .btn{background:#FAFBF7;color:#5E6E5C;border-color:#BFCAB8}
.theme-morandi .btn:hover{background:#E8EDE5;border-color:#7E9279;color:#5E6E5C}
.theme-morandi .btn-ghost{color:#7E9279}
.theme-morandi .btn-ghost:hover{background:#E8EDE5}
.theme-morandi .btn-ghost-danger{color:#B08080}
.theme-morandi .empty{color:#9AAA93}
.theme-morandi .fw-700{color:#5E6E5C}

/* ===== 项目阶段进度条 ===== */
.stage-bar{display:flex;gap:3px;margin-top:8px}
.stage-seg{flex:1;height:5px;border-radius:3px;background:#f0eeec}
.stage-seg.on{background:var(--green)}

/* ===== 模板 ===== */
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.tpl-card{background:var(--card);border-radius:var(--radius-sm);overflow:hidden;box-shadow:var(--shadow)}
.tpl-card-hd{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.tpl-card-body{padding:12px 14px}
.tpl-card-body pre{font-size:10px;line-height:1.7;color:var(--t2);white-space:pre-wrap;font-family:"SF Mono","Menlo",monospace;margin:0}
.tpl-card-ft{padding:8px 14px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:6px}
.tpl-dept{font-size:10px;color:var(--green);font-weight:600;margin-bottom:4px}
.cat-pills{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
.cat-pill{padding:5px 12px;border-radius:16px;border:1px solid var(--border);font-size:10px;cursor:pointer;font-weight:500;background:var(--card);color:var(--t2)}
.cat-pill:hover{border-color:var(--green);color:var(--green)}
.cat-pill.active{background:var(--green);color:#fff;border-color:var(--green)}

/* ===== 热点 / 文档 / 复盘 ===== */
.news-card{border-left:3px solid var(--pink);padding:2px 0 2px 12px;margin-bottom:10px}
.doc-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #f0eeec}
.doc-note{flex-basis:100%;order:9;margin-top:4px;padding:5px 8px;background:#fdf6ef;border:1px dashed #e6cfa8;border-radius:6px;font-size:11px;color:#8a6d3b;line-height:1.5}
.news-link{margin-top:5px;font-size:11px}
.news-link a{color:var(--pink);text-decoration:none;word-break:break-all}
.news-link a:hover{text-decoration:underline}
/* 热点资讯：项目分组 → 平台分组 */
.news-project{margin-top:14px;border-top:1px dashed #e6e2de;padding-top:10px}
.news-project:first-of-type{border-top:none}
.news-proj-title{font-size:14px;margin:0 0 6px;display:flex;align-items:center;gap:8px}
.news-proj-count{font-size:11px;color:var(--muted);font-weight:400}
.news-proj-chip{display:inline-block;background:linear-gradient(135deg,#5C8ABF,#7BA7D6);color:#fff;font-size:13px;font-weight:700;padding:3px 12px;border-radius:8px;box-shadow:0 2px 6px rgba(92,138,191,.22)}
.news-src-label{font-size:11px;color:#fff;background:var(--pink);display:inline-block;padding:1px 8px;border-radius:5px;margin:8px 0 6px}
.news-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.news-grid .news-card{margin-bottom:0;border-left:3px solid var(--pink);background:#fff;border-radius:8px;padding:8px 10px}
.news-grid .news-card .text-xs{color:var(--muted)}
/* 手动监测子窗口 */
.monitor-box{margin-top:16px;border-top:2px solid var(--pink);padding-top:12px}
.monitor-result{margin-top:10px}
.monitor-result .card{background:#fff;border-radius:8px;padding:10px;margin-bottom:8px}
.monitor-result .heat{color:#ff6a3d;font-weight:600}
.fg-inp{flex:1;padding:7px 10px;border:1px solid #ddd;border-radius:8px;font-size:13px}
.mt-8{margin-top:8px}
.doc-row:last-child{border-bottom:none}
.doc-row a{font-size:11px;color:var(--green);text-decoration:none;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.review-block{border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:11px;line-height:1.6}
.review-block .rb-label{font-weight:700;font-size:10px;margin-bottom:2px}
.review-good{background:var(--green-light)}.review-good .rb-label{color:#5a7a55}
.review-improve{background:#f5edf1}.review-improve .rb-label{color:#9b7d8a}
.review-reuse{background:#e8ecf2}.review-reuse .rb-label{color:#6b7d94}

/* ===== Toast / Footer ===== */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#4a4457;color:#fff;padding:8px 20px;border-radius:16px;font-size:11px;z-index:100;opacity:0;transition:all .25s}
.sync-pill{position:fixed;right:12px;bottom:12px;z-index:60;font-size:12px;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.92);color:#5b7a99;box-shadow:0 2px 8px rgba(91,122,153,.25);backdrop-filter:blur(4px);pointer-events:none;font-weight:600}
.toast.show{opacity:1}
.footer{padding:16px;text-align:center;font-size:10px;color:var(--t3);border-top:1px solid var(--border);background:var(--card)}
.footer .btn{margin:0 4px}

@media(max-width:768px){
  .header{padding:14px}
  .panels{padding:8px}
  .tpl-grid{grid-template-columns:1fr}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
}

/* ===== 链接快捷入口（AI TOOL / 🎮） ===== */
.links-wrap{max-width:900px;margin:0 auto}
.links-sub{font-size:12px;color:var(--t3);margin:-4px 0 12px}
.links-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:12px}
.link-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:9px}
.link-badge{display:inline-block;align-self:flex-start;background:var(--green);color:#fff;font-size:12px;font-weight:700;padding:3px 11px;border-radius:999px;cursor:pointer;text-decoration:none;transition:opacity .15s,filter .15s,transform .1s}
.link-badge:hover{opacity:.9;filter:brightness(1.06);transform:translateY(-1px)}
.link-badge:active{transform:translateY(0)}
.link-url{font-size:12px;color:var(--t1);text-decoration:none;word-break:break-all;line-height:1.5}
.link-url:hover{color:var(--green);text-decoration:underline}
.link-acts{display:flex;gap:8px;justify-content:flex-end;margin-top:2px}
/* 俏皮风 🎮 休闲娱乐区 */
.links-fun{font-family:"Comic Sans MS","PingFang SC","Hiragino Sans GB",sans-serif}
.links-fun .links-sub{color:#b88aa0}
.links-fun .link-card{background:linear-gradient(135deg,#fdf8fa,#f3f0f7);border:2px dashed var(--pink);border-radius:18px;transform:rotate(-.5deg);transition:transform .15s,box-shadow .15s;box-shadow:0 4px 14px rgba(201,167,184,.12)}
.links-fun .link-card:nth-child(even){transform:rotate(.7deg)}
.links-fun .link-card:hover{transform:rotate(0) scale(1.035);box-shadow:0 8px 22px rgba(201,167,184,.24)}
.links-fun .link-badge{background:linear-gradient(135deg,var(--pink),#deb0c4);font-size:13px;cursor:pointer;text-decoration:none;transition:opacity .15s,filter .15s,transform .1s}
.links-fun .link-badge:hover{opacity:.92;filter:brightness(1.05);transform:translateY(-1px)}
.links-fun .link-url:hover{color:var(--pink-d)}
.tab-fun{color:var(--pink-d)!important;font-weight:700}
.tab-fun:hover{background:#f7e8ef!important}
.tab-fun.active{background:linear-gradient(135deg,#F5E5EE,#efd9e6)!important;color:#b87895!important;box-shadow:0 2px 8px rgba(234,194,214,.4)!important}
.tab-fun.active::after{background:var(--pink-d)!important;height:3px}

/* ===== 麻美吉小人贴图 ===== */
.mametchi{display:inline-block;vertical-align:middle}
.mametchi-header{height:34px;margin-right:6px;filter:drop-shadow(0 2px 3px rgba(120,140,180,.35))}
.mametchi-header.mametchi-side{height:58px;margin:0 4px 0 0;transform:translateY(4px) rotate(-4deg);filter:drop-shadow(0 4px 6px rgba(120,140,180,.35))}
.header-mascot{display:flex;align-items:center;gap:10px}
.mametchi-fun{height:40px;margin-left:12px;vertical-align:middle;transform:translateY(3px) rotate(-4deg);filter:drop-shadow(0 3px 5px rgba(140,110,140,.35))}

/* ===== 链接卡片 favicon + 名称超链接 ===== */
.link-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.link-logo{width:22px;height:22px;border-radius:6px;border:1px solid var(--border);background:#fff;object-fit:contain;flex-shrink:0}
.link-logo-emoji{width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.link-badge{display:inline-block;background:var(--green);color:#fff;font-size:12px;font-weight:700;padding:3px 11px;border-radius:999px;text-decoration:none}
.link-badge:hover{opacity:.88;text-decoration:underline}
.links-fun .link-logo{border-color:#f0c4dc}

/* ===== 重要文档：本地文件 chip ===== */
.doc-file{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:#3f7fb5;background:#eef4fb;border:1px solid var(--border);padding:3px 10px;border-radius:999px;text-decoration:none;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;border:none;font-family:inherit}
.doc-file:hover{background:#e2edf8;text-decoration:underline}

/* ===== 文件预览 modal ===== */
.modal-wide{width:900px;max-width:96vw}
.preview-actions{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px}
.preview-actions .file-name{font-weight:700;color:var(--text);font-size:13px}
.preview-actions .btn-group{display:flex;gap:8px}
.preview-loading{padding:40px;text-align:center;color:var(--t2);font-size:13px}
.preview-error{padding:40px;text-align:center;color:var(--pink-d)}
.preview-error a{color:#3f7fb5;text-decoration:underline}
.preview-table-wrap{overflow:auto;max-height:60vh;border:1px solid var(--border);border-radius:8px;margin-top:8px;background:#fff}
.preview-table{border-collapse:collapse;width:100%;font-size:12px}
.preview-table th,.preview-table td{border:1px solid #e1e7ee;padding:6px 9px;text-align:left;white-space:nowrap}
.preview-table th{background:#f4f7fa;font-weight:600;position:sticky;top:0;z-index:1}
.preview-table tr:nth-child(even){background:#fafbfc}
.preview-text{max-height:60vh;overflow:auto;background:#f9fafb;border:1px solid var(--border);border-radius:8px;padding:14px;font-size:12px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.preview-img{max-width:100%;max-height:70vh;display:block;margin:0 auto;border-radius:8px;border:1px solid var(--border)}
.preview-pdf iframe,.preview-pdf embed{width:100%;height:65vh;border:1px solid var(--border);border-radius:8px}
.preview-docx{background:#fff;border:1px solid var(--border);border-radius:8px;padding:20px;max-height:65vh;overflow:auto}

/* ===== 手动拖拽排序 ===== */
.drag-item{position:relative}
.drag-h{display:inline-flex;align-items:center;justify-content:center;width:18px;min-width:18px;height:18px;margin-right:6px;color:#b9c2cf;cursor:grab;font-size:14px;line-height:1;border-radius:4px;user-select:none;opacity:.55;transition:opacity .15s,color .15s}
.drag-h:hover{opacity:1;color:var(--blue,#9BB9D8);background:rgba(155,185,216,.12)}
.drag-item.dragging{opacity:.45}
.drag-item.dragging .drag-h{cursor:grabbing}
.drag-over-a{box-shadow:inset 0 3px 0 0 var(--pink,#EAC2D6)}
.drag-over-b{box-shadow:inset 0 -3px 0 0 var(--pink,#EAC2D6)}

</style>

/* ================= 手动拖拽排序（user order preference） ================= */
/* 返回按「手动顺序」排列后的数组；未手动排过的条目按原数组顺序排到末尾 */
function orderItems(arr,key,idFn){
  var m=S.manual&&S.manual[key];
  if(!m||!m.length)return arr.slice();
  var pos={};m.forEach(function(id,i){pos[id]=i;});
  var known=[],unknown=[];
  arr.forEach(function(x){var id=idFn(x);(id in pos?known:unknown).push(x);});
  known.sort(function(a,b){return pos[idFn(a)]-pos[idFn(b)];});
  if(key==="projects")return unknown.concat(known);
  return known.concat(unknown);
}
var _dragSrc=null;
function bindDrag(panelId,key){
  var panel=document.getElementById(panelId);
  if(!panel)return;
  panel.querySelectorAll(".drag-item").forEach(function(el){
    el.setAttribute("draggable","true");
    if(!el.querySelector(".drag-h")){
      var h=document.createElement("span");h.className="drag-h";h.textContent="⠿";h.title="拖拽排序";
      el.insertBefore(h,el.firstChild);
    }
  });
  panel.ondragstart=function(e){
    var it=e.target.closest&&e.target.closest(".drag-item");if(!it)return;
    _dragSrc=it;it.classList.add("dragging");e.dataTransfer.effectAllowed="move";
    try{e.dataTransfer.setData("text/plain",it.getAttribute("data-drag-id")||"");}catch(_){}
  };
  panel.ondragover=function(e){
    var it=e.target.closest&&e.target.closest(".drag-item");if(!it||it===_dragSrc)return;
    e.preventDefault();
    var r=it.getBoundingClientRect();var after=(e.clientY-r.top)>r.height/2;
    panel.querySelectorAll(".drag-over-a,.drag-over-b").forEach(function(x){x.classList.remove("drag-over-a","drag-over-b");});
    it.classList.add(after?"drag-over-b":"drag-over-a");
  };
  panel.ondrop=function(e){
    var it=e.target.closest&&e.target.closest(".drag-item");if(!it||!_dragSrc)return;
    e.preventDefault();
    var r=it.getBoundingClientRect();var after=(e.clientY-r.top)>r.height/2;
    if(after)it.parentNode.insertBefore(_dragSrc,it.nextSibling);else it.parentNode.insertBefore(_dragSrc,it);
    commitDrag(panelId,key);
  };
  panel.ondragend=function(){
    if(_dragSrc)_dragSrc.classList.remove("dragging");_dragSrc=null;
    panel.querySelectorAll(".drag-over-a,.drag-over-b").forEach(function(x){x.classList.remove("drag-over-a","drag-over-b");});
  };
}
function commitDrag(panelId,key){
  var panel=document.getElementById(panelId);if(!panel)return;
  var vis=[];panel.querySelectorAll(".drag-item").forEach(function(el){vis.push(el.getAttribute("data-drag-id"));});
  var prev=(S.manual&&S.manual[key])?S.manual[key].slice():[];
  var visSet={};vis.forEach(function(id){visSet[id]=1;});
  /* 在保留「未显示条目」原有相对顺序的前提下，把可见条目按新的拖拽顺序落位（筛选视图拖拽也安全） */
  var vi=0,newOrder=[];
  prev.forEach(function(id){ if(visSet[id]){newOrder.push(vis[vi++]);} else newOrder.push(id); });
  while(vi<vis.length)newOrder.push(vis[vi++]);
  S.manual=S.manual||{};S.manual[key]=newOrder;S.manualTS=Date.now();
  S.save();
  RENDER[ct](); /* 重渲染当前 tab，应用新顺序（并推云端） */
}
/* 已完成项目容错识别：news.project 可能是项目名缩写/前缀（如"希尔X盈香" vs 完整"希尔X盈香心动花园"）。
   仅当它等于某已完成项目名，或是某已完成项目名的前缀且不是任何进行中项目的前缀时，才视为已完成，
   避免误伤同名前缀的进行中项目（如"百度文库"前缀不能误删"百度文库-博物馆"）。 */
function projIsDone(name){
  if(!name) return false;
  if(S.projects.some(function(p){return p.name===name && p.status==="已完成"})) return true;
  var prefixOfActive=false, prefixOfDone=false;
  S.projects.forEach(function(p){
    if(p.name && p.name.indexOf(name)===0){
      if(p.status==="已完成") prefixOfDone=true; else prefixOfActive=true;
    }
  });
  return prefixOfDone && !prefixOfActive;
}

/* ================= 飞书链接自动识别标题 =================
   三重机制：
   1) 粘贴「标题 + 链接」混合文本时自动拆分（飞书分享复制常带标题）
   2) 已知链接字典：工作台里所有已存文档的 link→name 自动匹配
   3) 尝试抓取网页 <title>（飞书需登录且跨域，多数情况会静默失败，作为兜底） */
function buildLinkDict(){
  var dict={};
  S.impdocs.forEach(function(d){if(d.link&&d.name)dict[d.link]=d.name});
  S.projdocs.forEach(function(p){(p.docs||[]).forEach(function(d){if(d.link&&d.name)dict[d.link]=d.name})});
  return dict;
}
function attachLinkAutoTitle(linkEl,nameEl){
  function handle(){
    var raw=linkEl.value.trim();
    var m=raw.match(/https?:\/\/[^\s"'<>]+/);
    if(!m)return;
    var url=m[0];
    if(url!==raw)linkEl.value=url; // 拆出纯链接
    var rest=raw.replace(url,"").replace(/[「」『』【】\[\]<>《》"'()（）\s]+/g," ").trim();
    if(rest&&!nameEl.value){nameEl.value=rest;toast("已从粘贴文本识别标题");return}
    var dict=buildLinkDict();
    if(dict[url]&&!nameEl.value){nameEl.value=dict[url];toast("已自动识别标题");return}
    if(!nameEl.value){
      fetch(url).then(function(r){return r.text()}).then(function(h){
        var tm=h.match(/<title[^>]*>([^<]+)<\/title>/i);
        if(tm&&tm[1]&&!nameEl.value){nameEl.value=tm[1].trim();toast("已抓取网页标题")}
      }).catch(function(){/* 跨域/需登录时静默失败 */})
    }
  }
  linkEl.addEventListener("paste",function(){setTimeout(handle,0)});
  linkEl.addEventListener("change",handle);
}

    var t=el.dataset.dailyTitle;
    var item=(S.daily||[]).find(function(x){return x.title===t&&x.date===d});
    var ok=!!(item&&(item.content||item.stars||item.tip));
    el.classList.toggle("has-today",ok);
    if(t==="巨蟹座每日运势"&&item&&item.stars){
      var st=item.stars;
      el.innerHTML="♋ 巨蟹座 "+["财富","事业","爱情","综合"].map(function(k){return k+stars(st[k])}).join(" ");
    }else if(t==="喜水木の今日tip"&&item&&item.tip){
      el.innerHTML="💧🌳 喜水木の今日tip："+esc(item.tip);
    }else if(item&&item.content){
      el.innerHTML=esc(item.content.slice(0,42));
    }
  });
  document.querySelectorAll("[data-daily-title]").forEach(function(el){
    if(el.dataset.bound)return;el.dataset.bound="1";
    el.addEventListener("click",function(){dailyPopover(el.dataset.dailyTitle, el)});
  });
}
function dailyPopover(title, anchor){
  var d=todayStr();
  var cur=(S.daily||[]).find(function(x){return x.title===title&&x.date===d});
  var hist=(S.daily||[]).filter(function(x){return x.title===title})
    .sort(function(a,b){return dateKey(b.date)-dateKey(a.date)});
  var body="";
  if(cur){
    if(cur.stars){
      body+='<div class="daily-stars">'
        +["综合","财富","事业","爱情"].map(function(k){
            return '<div><b>'+k+'</b> '+stars(cur.stars[k])+'</div>';
          }).join("")+'</div>';
    }
    if(cur.tip){
      body+='<div class="daily-tip">'+esc(cur.tip)+'</div>';
    }
    if(cur.content){
      body+='<div class="daily-long">'+esc(cur.content)+'</div>';
    }
  }else{
    body+='<div class="muted">今天还没有内容，点 🔄 刷新运势让我帮你搜～</div>';
  }
  var past=hist.filter(function(h){return h.date!==d});
  if(past.length){
    body+='<div class="daily-hist"><div class="hd">📜 历史记录（最近 '+Math.min(past.length,8)+' 条）</div>';
    past.slice(0,8).forEach(function(h){
      var txt=h.tip?h.tip:(h.content?h.content.slice(0,90):(h.stars?("综合"+stars(h.stars["综合"])+" 财富"+stars(h.stars["财富"])+" 事业"+stars(h.stars["事业"])+" 爱情"+stars(h.stars["爱情"])):"—"));
      body+='<div class="item"><div class="dt">'+esc(h.date)+'</div><div style="white-space:pre-wrap;line-height:1.5">'+esc(txt)+'</div></div>';
    });
    body+='</div>';
  }
  var html='<div class="daily-pop" id="dp-pop">'
    +'<div class="daily-pop-hd"><span>📅 '+esc(title)+' · '+esc(d)+'</span><button class="modal-close" id="dp-close" aria-label="关闭">×</button></div>'
    +'<div class="daily-pop-bd">'+body+'</div>'
    +'</div>';
  var ex=document.getElementById("dp-pop"); if(ex)ex.remove();
  document.body.insertAdjacentHTML("beforeend",html);
  var pop=document.getElementById("dp-pop");
  var r=anchor.getBoundingClientRect();
  var pw=344, ph=pop.offsetHeight||300;
  var left=r.left;
  var top=r.bottom+8;
  if(left+pw>window.innerWidth-12) left=Math.max(12,window.innerWidth-pw-12);
  if(top+ph>window.innerHeight-12) top=Math.max(12,r.top-ph-8);
  pop.style.left=left+"px";
  pop.style.top=top+"px";
  function closePop(){pop.remove();document.removeEventListener("mousedown",onDoc,true);document.removeEventListener("keydown",onKey,true);window.removeEventListener("resize",closePop,true);}
  function onDoc(e){
    if(pop.contains(e.target))return;
    if(e.target===anchor||anchor.contains(e.target))return;
    closePop();
  }
  function onKey(e){if(e.key==="Escape")closePop();}
  setTimeout(function(){
    document.addEventListener("mousedown",onDoc,true);
    document.addEventListener("keydown",onKey,true);
    window.addEventListener("resize",closePop,true);
  },0);
  document.getElementById("dp-close").addEventListener("click",closePop);
}


function refreshDaily(){
  var btn=document.getElementById("daily-refresh");
  if(!btn||btn.disabled)return;
  if(!backendAvailable()){toast("云端版不支持刷新运势，请在 Mac 本地工作台点击刷新",3800);return;}
  btn.disabled=true; btn.textContent="刷新中...";
  fetch("/api/refresh-daily",{method:"POST"})
    .then(function(r){return r.json()})
    .then(function(data){
      if(Array.isArray(data)){
        S.daily=data;
        S.save(true);
        refreshDailyChips();
        toast("今日运势已刷新");
      }else{
        toast("刷新失败："+(data.error||"未知错误"));
      }
    })
    .catch(function(e){toast("刷新失败："+e.message)})
    .finally(function(){btn.disabled=false; btn.textContent="🔄 刷新运势";});
}

function canonProjs(){

function projRank(name){

/* ================= 5. 热点资讯 ================= */
function rn(){
  /* 手动监测子窗口置顶：话题词上榜 / 链接读取（基于 Agent Reach） */
  var html='<section class="monitor-box" style="margin-bottom:18px"><h3 class="news-proj-title">🔍 手动监测</h3>'
    +'<div class="text-xs" style="margin-bottom:8px;color:var(--muted)">输入话题词查各平台是否上榜，或粘贴链接用 Agent Reach 读取内容</div>'
    +'<div class="row gap-4"><input id="monitor-input" class="fg-inp" style="flex:1" placeholder="话题词，或 https://... 链接">'
    +'<button class="btn btn-sm btn-pink" id="monitor-btn">监测</button></div>'
    +'<div id="monitor-result" class="monitor-result"></div></section>'
    +'<div class="row mb-12"><button class="btn btn-pink btn-sm" id="add-news-btn">+ 添加热点</button>'
    +'<button class="btn btn-sm" id="import-hot-btn">导入抓取热点</button></div>';
  var doneProjs=S.projects.filter(function(p){return p.status==="已完成"}).map(function(p){return p.name});
  var validProjNames=S.projects.map(function(p){return p.name});
  var visNews=S.news.filter(function(n){
    if(!n.project)return true; /* 通用热点 */
    if(validProjNames.indexOf(n.project)<0)return false; /* 项目已删除 → 不显示其热点 */
    if(projIsDone(n.project))return false; /* 已完成项目 → 不显示其热点 */
    return true;
  });
  visNews=orderItems(visNews,"news",function(n){return n.id}); /* 手动排序覆盖（按来源分组时组内仍遵循手动顺序） */
  /* 按项目分组：先列出所有「进行中项目」（即使 0 命中也显示监测状态），再补新闻里存在但不在项目表的键（如 通用热点） */
  var activeProjList=canonProjs().filter(function(p){return p.status!=="已完成"}).map(function(p){return {name:p.name,stage:p.stage||0}});
  var byProj={}, order=[];
  visNews.forEach(function(n){
    var key=n.project||"通用热点";
    if(!byProj[key]){byProj[key]=[];order.push(key);}
    byProj[key].push(n);
  });
  var projKeys=activeProjList.map(function(p){return p.name});
  var extraKeys=order.filter(function(k){return projKeys.indexOf(k)<0});
  var finalOrder=projKeys.concat(extraKeys);
  if(finalOrder.length){
    finalOrder.forEach(function(pn){
      var items=byProj[pn]||[];
      html+='<section class="news-project"><h3 class="news-proj-title"><span class="news-proj-chip">'+esc(pn)
        +'</span> <span class="news-proj-count">'+items.length+' 条</span>'
        +' <button class="btn-ghost btn-ghost-danger" data-nw-clear="'+esc(pn)+'" title="清空/移除该项目热点">🗑 清空</button>'
        +'</h3>';
      if(!items.length){
        html+='<div class="text-xs" style="color:var(--muted);margin:2px 0 6px">监测中 · 暂无命中（可在项目里填「抓取关键词」提高命中率）</div>';
      } else {
        /* 项目内再按平台分组 */
        var bySrc={}, srcOrder=[];
        items.forEach(function(n){
          var s=n.source||"其他";
          if(!bySrc[s]){bySrc[s]=[];srcOrder.push(s);}
          bySrc[s].push(n);
        });
        srcOrder.forEach(function(sn){
          var list=bySrc[sn];
          html+='<div class="news-src-label">'+esc(sn)+' <span class="news-proj-count">'+list.length+'</span></div>';
          html+='<div class="news-grid">';
          list.forEach(function(n){
            var lk=newsLink(n);
            html+='<div class="drag-item news-card" data-drag-id="'+n.id+'"><div class="row row-between"><div>'
              +(n.type==="content"?'<span class="badge" style="background:#e8833a;color:#fff;font-size:10px;padding:0 6px;border-radius:4px">📄内容监测</span> ':'')
              +'<span class="text-xs">'+esc(n.date||"")+'</span></div>'
              +'<div class="sh0"><button class="btn-ghost" data-nw-edit="'+n.id+'">编辑</button><button class="btn-ghost btn-ghost-danger" data-nw-del="'+n.id+'">✕</button></div></div>'
              +'<div style="font-weight:600;font-size:12px;margin:4px 0">'+esc(n.title)+'</div>'
              +(n.summary?'<div class="text-xs">'+esc(n.summary)+'</div>':'')
              +(lk?'<div class="news-link"><a href="'+esc(lk)+'" target="_blank" rel="noopener">🔗 查看原文</a></div>':'')
              +'</div>';
          });
          html+='</div>';
        });
      }
      html+='</section>';
    });
  } else {
    html+='<div class="empty">暂无热点资讯（已完成项目已自动隐藏）</div>';
  }
  document.getElementById("pnl-news").innerHTML=html;
  bindDrag("pnl-news","news");
  document.getElementById("add-news-btn").addEventListener("click",function(){newsModal(null)});
  document.querySelectorAll("[data-nw-edit]").forEach(function(b){b.addEventListener("click",function(){newsModal(+b.dataset.nwEdit)})});
  document.querySelectorAll("[data-nw-del]").forEach(function(b){
    b.addEventListener("click",function(){tombstone("news", +b.dataset.nwDel); S.news=S.news.filter(function(x){return x.id!==+b.dataset.nwDel});S.save();rn()});
  });
  document.getElementById("import-hot-btn").addEventListener("click",importHot);
  document.getElementById("monitor-btn").addEventListener("click",runMonitor);
  document.querySelectorAll("[data-nw-clear]").forEach(function(b){
    b.addEventListener("click",function(){
      var pn=b.dataset.nwClear;
      var cnt=S.news.filter(function(n){return (pn==="通用热点")?(n.project||"通用热点")===pn:n.project===pn}).length;
      var msg=cnt>0
        ?"确认清空「"+pn+"」下的 "+cnt+" 条热点？\n（项目本身仍在「项目进度」中；若该项目仍填了抓取关键词，下次导入抓取热点会重新生成）"
        :"确认移除「"+pn+"」的热点监控？\n（项目本身仍在「项目进度」中；若该项目仍填了抓取关键词，下次导入抓取热点会重新出现）";
      if(!confirm(msg))return;
      var ids=S.news.filter(function(n){return (pn==="通用热点")?(n.project||"通用热点")===pn:n.project===pn}).map(function(n){return n.id});
      ids.forEach(function(id){tombstone("news",id)});
      S.news=S.news.filter(function(n){return ids.indexOf(n.id)<0});
      S.save();rn();
    });
  });
}

  omod('<h3>'+(n?"编辑热点":"添加热点")+'</h3>'

    if(n){Object.assign(n,data)}else{data.id=S.nid(S.news);S.news.push(data)}

function importHot(){
  var btn=document.getElementById("import-hot-btn");
  if(!backendAvailable()){toast("云端版不支持自动抓取热点，请在 Mac 本地工作台操作",3800);return;}
  btn.disabled=true;btn.textContent="抓取中…";
  function done(){btn.disabled=false;btn.textContent="导入抓取热点"}
  var doneProjs=S.projects.filter(function(p){return p.status==="已完成"}).map(function(p){return p.name});
  var validProjNames=S.projects.map(function(p){return p.name}); /* 用于过滤已删除项目的热点 */
  /* 已完成项目仅解除热点关联（保留项目记录，不删除），抓取时跳过 + 下方 merge 兜底 */
  function merge(j,live){
    var items=j.items||[],added=0,skipped=0,updated=0;
    var srcMap={"weibo":"微博","douyin":"抖音","xhs":"小红书"};
    items.forEach(function(it){
      /* 已完成项目的热点不导入（服务器已过滤，这里再兜底一次；用容错识别，兼容项目名缩写） */
      if(it.project&&projIsDone(it.project)){skipped++;return}
      var existing=S.news.find(function(n){return n.title===it.title});
      if(!existing){S.news.push({id:S.nid(S.news),date:todayMD(),source:srcMap[it.source]||it.source,title:it.title,summary:it.kw?("命中关键词："+it.kw):"",project:it.project||"",link:it.link||""});added++}
      else if(it.link&&!existing.link){existing.link=it.link;updated++} /* 已有同名热点但没链接 → 补上 */
    });
    S.news=S.news.filter(function(n){
      if(!n.project)return true;
      if(validProjNames.indexOf(n.project)<0)return false; /* 项目已删除 → 不显示其热点 */
      if(projIsDone(n.project))return false; /* 已完成项目 → 不显示其热点 */
      return true;
    });
    S.save();rn();
    var msg=(added?("已导入 "+added+" 条热点"):"没有新的热点")+(updated?("，为 "+updated+" 条已有热点补上链接"):"")+"（"+(j.fetchedAt||"未知时间")+(live?" 实时抓取":" 历史数据")+"）";
    if(doneProjs.length)msg+="；已完成项目（"+doneProjs.join("、")+"）已跳过抓取";
      if(j.errors&&j.errors.xhs)msg+="；小红书源暂不可用";
      if(j.errors&&j.errors.twitter)msg+="；X趋势未就绪（需在 Chrome 登录 X 并启用 OpenCLI）";
      var ce=j.errors||{},cePlats=Object.keys(ce).filter(function(k){return k.indexOf("_content")>=0}).map(function(k){return (srcMap[k.replace("_content","")]||k.replace("_content",""))+"内容"});
      if(cePlats.length)msg+="；内容监测："+cePlats.join("/")+"未就绪（需在 Chrome 登录）";
      toast(msg);done();
  }
  /* 把浏览器里的最新项目状态发给服务器，按「进行中项目」强匹配 */
  var payload=JSON.stringify({projects:S.projects.map(function(p){return{name:p.name,status:p.status,hotKw:p.hotKw||""}})});
  fetch("/api/refresh-hot",{method:"POST",headers:{"Content-Type":"application/json"},body:payload})
    .then(function(r){if(!r.ok)throw new Error("no api");return r.json()})
    .then(function(j){merge(j,true)})
    .catch(function(){
      /* 兜底1：GET 实时抓取（服务器按文件里的项目状态） 兜底2：静态历史文件 */
      fetch("/api/refresh-hot").then(function(r){if(!r.ok)throw new Error("no api");return r.json()})
        .then(function(j){merge(j,true)})
        .catch(function(){
          fetch("hot_fetch_output.json").then(function(r){return r.json()}).then(function(j){merge(j,false)})
          .catch(function(){
            if(location.protocol==="file:"){toast("本地文件模式无法抓取：请在地址栏打开 http://localhost:8890/index-v2.html",4000)}
            else{toast("抓取失败：服务可能没启动，双击「启动工作台.command」后再试",4000)}
            done();
          });
        });
    });
}

/* 手动监测：话题词上榜 / 链接读取（调 /api/monitor，基于 Agent Reach） */
function runMonitor(){
  var inp=document.getElementById("monitor-input");
  var txt=(inp.value||"").trim();
  if(!txt){toast("请输入话题词或链接");return;}
  if(!backendAvailable()){toast("云端版不支持监测，请在 Mac 本地工作台操作",3800);return;}
  var box=document.getElementById("monitor-result");
  box.innerHTML='<div class="text-xs">监测中…（首次可能需唤起浏览器登录）</div>';
  fetch("/api/monitor",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({text:txt})})
    .then(function(r){if(!r.ok)throw new Error("no");return r.json()})
    .then(function(j){renderMonitor(j,txt)})
    .catch(function(){box.innerHTML='<div class="text-xs" style="color:#e8833a">监测失败：服务未启动或在云端版，请在 Mac 本地打开 http://localhost:8890</div>'});
}
function renderMonitor(j,txt){
  var box=document.getElementById("monitor-result");
  if(!j||!j.ok){box.innerHTML='<div class="text-xs" style="color:#e8833a">'+(j&&j.error?j.error:"监测失败")+'</div>';return;}
  if(j.mode==="link"){
    var c=j.content||{}, label=j.platform||"链接";
    var title=(c.title||c.desc||c.text||"(无标题)");
    var h='<div class="card" style="border-left:3px solid var(--pink)"><div class="row row-between"><span class="badge badge-pink">'+esc(label)+'</span></div>'
      +'<div style="font-weight:600;font-size:13px;margin:6px 0">'+esc(String(title).slice(0,120))+'</div>'
      +(c.desc||c.text?'<div class="text-xs" style="max-height:140px;overflow:auto;white-space:pre-wrap">'+esc(String(c.desc||c.text).slice(0,500))+'</div>':'')
      +(c.error?'<div class="text-xs" style="color:#e8833a;margin-top:6px">'+esc(c.error)+'</div>':'')
      +(j.url?'<div class="news-link"><a href="'+esc(j.url)+'" target="_blank" rel="noopener">🔗 查看原文</a></div>':'')
      +'<div class="row row-end mt-8"><button class="btn btn-sm" id="monitor-save">存入热点资讯</button></div></div>';
    box.innerHTML=h;
    document.getElementById("monitor-save").addEventListener("click",function(){
      S.news.push({id:S.nid(S.news),date:todayMD(),source:label,title:String(title).slice(0,80),
        summary:"手动监测链接",project:"",link:j.url||""});
      S.save();rn();box.innerHTML='<div class="text-xs" style="color:#4f8cff">已存入热点资讯 ✓</div>';
    });
  } else if(j.mode==="keyword"){
    if(!j.hits||!j.hits.length){
      box.innerHTML='<div class="text-xs">「'+esc(j.word)+'」当前未在监测平台（微博 / 抖音 / X / 小红书）上榜</div>';
    } else {
      var hh='<div class="text-xs" style="margin-bottom:6px">「'+esc(j.word)+'」上榜情况：</div>';
      j.hits.forEach(function(hit){
        hh+='<div class="card" style="border-left:3px solid '+(hit.color||"#4f8cff")+';margin-bottom:6px"><div class="row row-between"><span class="badge" style="background:'+(hit.color||"#4f8cff")+';color:#fff;font-size:11px;padding:1px 7px;border-radius:5px">'+esc(hit.platform)+'</span>'
          +(hit.rank!=null?'<span class="heat">🔥 热搜#'+esc(String(hit.rank))+'</span>':'')
          +'</div>'
          +'<div style="font-size:12px;margin:4px 0">'+esc(hit.title||hit.word)+'</div>'
          +(hit.url?'<div class="news-link"><a href="'+esc(hit.url)+'" target="_blank" rel="noopener">🔗 查看</a></div>':'')
          +'</div>';
      });
      box.innerHTML=hh;
    }
  }
}

          .catch(function(e){toast("上传失败："+e)});

function previewFile(url,name){
  var ext=(name.split('.').pop()||'').toLowerCase();
  var isXlsx=['xlsx','xls','csv'].indexOf(ext)>=0;
  var isDocx=ext==='docx';
  var isPdf=ext==='pdf';
  var isImg=['jpg','jpeg','png','gif','webp','bmp','svg'].indexOf(ext)>=0;
  var isTxt=['txt','md','json','js','css','html','py','csv'].indexOf(ext)>=0;

  var actions='<div class="preview-actions">'
    +'<span class="file-name">📎 '+esc(name)+'</span>'
    +'<div class="btn-group">'
    +'<a class="btn btn-primary btn-sm" href="'+esc(url)+'" target="_blank" download>⬇ 下载原文件</a>'
    +'<button class="btn btn-sm" id="pv-close">关闭</button>'
    +'</div></div>';
  omod('<h3>文件预览</h3>'+actions+'<div id="pv-body" class="preview-loading">正在加载预览...</div>');
  document.getElementById("pv-close").addEventListener("click",cmod);
  var md=document.querySelector(".modal");if(md)md.classList.add("modal-wide");

  function showError(msg,download){
    var b=document.getElementById("pv-body");b.className="preview-error";
    b.innerHTML=(msg||"无法预览该文件")+(download?'<br><a href="'+esc(url)+'" target="_blank" download>点击下载原文件</a>':"");
  }

  if(isXlsx){
    if(typeof XLSX==="undefined"){showError("表格预览库未加载，请检查网络");return;}
    fetch(url).then(function(r){if(!r.ok)throw new Error("加载失败");return r.arrayBuffer()}).then(function(ab){
      var wb=XLSX.read(new Uint8Array(ab),{type:"array"});
      if(!wb.SheetNames.length){showError("表格为空");return;}
      var ws=wb.Sheets[wb.SheetNames[0]];
      var html=XLSX.utils.sheet_to_html(ws,{id:"pv-table",class:"preview-table"});
      var b=document.getElementById("pv-body");b.className="preview-table-wrap";b.innerHTML=html;
    }).catch(function(e){showError("预览失败："+e.message,true)});
  }else if(isDocx){
    var docxLib=(typeof docxPreview!=="undefined"?docxPreview:(typeof docx!=="undefined"?docx:null));
    if(!docxLib){showError("Word 预览库未加载，请检查网络");return;}
    fetch(url).then(function(r){if(!r.ok)throw new Error("加载失败");return r.arrayBuffer()}).then(function(ab){
      var b=document.getElementById("pv-body");b.className="";b.innerHTML="";
      var el=document.createElement("div");el.className="preview-docx";el.id="pv-docx";b.appendChild(el);
      var render=(docxLib.renderAsync?docxLib.renderAsync:(docxLib.default&&docxLib.default.renderAsync?docxLib.default.renderAsync:null));
      if(!render){showError("Word 预览库异常",true);return;}
      render(ab,el,null,{className:"docx"}).catch(function(e){showError("Word 预览失败："+e.message,true)});
    }).catch(function(e){showError("预览失败："+e.message,true)});
  }else if(isPdf){
    var b=document.getElementById("pv-body");b.className="preview-pdf";
    b.innerHTML='<embed src="'+esc(url)+'" type="application/pdf" width="100%" height="100%">';
  }else if(isImg){
    var b=document.getElementById("pv-body");b.className="";
    b.innerHTML='<img class="preview-img" src="'+esc(url)+'" alt="'+esc(name)+'">';
  }else if(isTxt){
    fetch(url).then(function(r){if(!r.ok)throw new Error("加载失败");return r.text()}).then(function(t){
      var b=document.getElementById("pv-body");b.className="preview-text";b.textContent=t;
    }).catch(function(e){showError("预览失败："+e.message,true)});
  }else{
    showError("暂不支持该格式在线预览",true);
  }
}

var REMOTE_OK=false,pushTimer=null;
function remotePayload(){var d={};STORE_KEYS.forEach(function(k){d[k]=S[k]});return JSON.stringify(d)}

var origSave=S.save;
S.save=function(quiet){

    var _now=Date.now();

/* ================= 跨设备实时同步 ================= */
var syncTimer=null,syncing=false;
function setSyncPill(t){var el=document.getElementById("sync-pill");if(el)el.textContent=t;}
function modalOpen(){var m=document.querySelector(".modal-bg");return !!m && m.style.display!=="none"}
/* 多端合并（LWW 最后写入者胜）：
   - 去重 key：项目用「名称」、AI TOOL/🎮 用「链接」、其余用 id（避免 id 撞车互相掩盖）
   - 同名/同 key 的记录：谁 updatedAt 更新就留谁（云端有你手机刚改的→Mac 自动拿到；反之亦然）
   - 云端多出来的条目：直接补进本地
   - 本地优先原则：时间戳相同（极少）时保留本地，绝不删本地条目 */
function mergeKey(k,x){ if(!x)return null; if(k==="projects")return x.name; if((k==="aitool"||k==="fun")&&x.url)return x.url; return x.id; }
/* 墓碑（tombstone）：记录「已被用户删除的条目 key」，跨端同步，永不复活 */
function tombstone(storeKey, mergeKeyValue){
  if(mergeKeyValue==null) return;
  S.deleted=S.deleted||{};
  var list=S.deleted[storeKey]||(S.deleted[storeKey]=[]);
  if(list.indexOf(mergeKeyValue)<0) list.push(mergeKeyValue);
}
/* 按墓碑过滤数组：去掉所有被标记为已删除的条目 */
function applyTombs(k, arr){
  var tombs=(S.deleted||{})[k];
  if(!tombs||!tombs.length) return arr;
  return arr.filter(function(x){ return tombs.indexOf(mergeKey(k,x))<0; });
}
function mergeLWW(remote){
  if(!remote)return false;
  var changed=false;
  /* 先把「墓碑」从云端拉进本地（必须在下面数组循环用 applyTombs 过滤之前），
     否则循环过滤时 S.deleted 还是空的、过滤失效 → 已删条目被复活 */
  if(remote.deleted && typeof remote.deleted==="object"){
    S.deleted=S.deleted||{};
    Object.keys(remote.deleted).forEach(function(k2){
      var rlist=remote.deleted[k2]||[];
      var llist=S.deleted[k2]||(S.deleted[k2]=[]);
      rlist.forEach(function(v){ if(llist.indexOf(v)<0){ llist.push(v); changed=true; } });
    });
  }
  STORE_KEYS.forEach(function(k){
    var rem=remote[k], loc=S[k];
    if(Array.isArray(rem) && Array.isArray(loc)){
      var map={}, order=[];
      function take(x){
        var key=mergeKey(k,x);
        if(key==null)return;
        if(!(key in map)){ map[key]=x; order.push(key); }
        else{
          var cur=map[key];
          var xt=(x.updatedAt||0), ct=(cur.updatedAt||0);
          /* 远端时间戳更新 → 采用远端；时间戳相同（平局，多因旧页面清掉时间戳）→ 也听云端（云端是真源），避免手机卡在旧值 */
          if(xt>=ct){ map[key]=x; if(xt>ct) changed=true; }
        }
      }
      loc.forEach(take);
      rem.forEach(take);
      var merged=order.map(function(key){return map[key];});
      if(merged.length!==loc.length){ changed=true; }
      else{
        var lk={}; loc.forEach(function(x){var key=mergeKey(k,x); if(key!=null)lk[key]=x;});
        merged.forEach(function(x){var key=mergeKey(k,x); if(key!=null){var l=lk[key]; if(!l||JSON.stringify(l)!==JSON.stringify(x))changed=true;}});
      }
      S[k]=applyTombs(k, merged);
    } else if(Array.isArray(rem) && !Array.isArray(loc)){
      S[k]=applyTombs(k, rem); changed=true;
    }
  });
  /* 手动排序偏好：整对象 LWW（按 manualTS 取较新一方，平局听云端真源） */
  if(remote.manualTS && remote.manualTS>=(S.manualTS||0)){
    S.manual=remote.manual||{}; S.manualTS=remote.manualTS||0; changed=true;
  }
  return changed;
}
/* 双向同步：拉云端做 LWW 合并（含你刚在手机改的）+ 把本地整体推云端 → 两端收敛一致。
   绝不吃本地数据（新增/改动都保留，谁新听谁的）。 */
function syncPull(){
  if(!REMOTE_OK||syncing)return;
  if(modalOpen())return; /* 正在编辑时不打断 */
  syncing=true;
  cloudGet(function(remote){
    syncing=false;
    var changed=remote?mergeLWW(remote):false; /* 先按 LWW 合并云端改动（含你刚在手机改的） */
    S.save(true);
    cloudPut(cloudObj(),function(ok){ /* 把本地(含合并来的云端)整体回推 → 两端收敛一致 */
      setSyncPill(ok?"☁️ 已同步云端":"📴 离线·本机");
      if(!ok)toast("未能同步到云端，改动已保存在本机",3000);
    });
    var ct2=document.querySelector(".tab-btn.active");
    ct2=(ct2&&ct2.dataset.tab)||"overview";
    st(ct2);
    if(changed)toast("已合并云端的最新改动");
  });
}
function startSync(){
  /* 安全自动同步：每 30 秒用 mergeLWW 合并云端（本地优先、按 updatedAt 取最新、绝不删本地）。
     只有真的合并到新内容时才回推云端，空闲时不打扰、不重渲染。
     这是对原「每 20 秒覆盖式拉取」的修正——覆盖会吃数据，merge 不会。 */
  if(syncTimer)clearInterval(syncTimer);
  syncTimer=setInterval(function(){
    if(modalOpen())return; /* 编辑中不触发 */
    syncPull();
  },300000); /* 5 分钟自动同步一次（原 30 秒太频繁，浪费云端请求额度） */
}

/* ================= 13. hello AI（外接大模型 · 页面内对话） ================= */
function rhaic(){
  var p=document.getElementById("pnl-helloai"); if(!p)return;
  if(!window._ai) window._ai={chat:DB.g("aichat",[]),streaming:false,active:DB.g("aiactive",null),collapsed:DB.g("aicollapsed",true),editId:null};
  // 迁移旧的单配置（aicfg）为数组（aicfgs）
  var cfgs=DB.g("aicfgs",null);
  if(cfgs===null){
    var old=DB.g("aicfg",null);
    cfgs=(old&&old.base)?[{id:Date.now(),name:"我的 API",base:old.base,key:old.key,model:old.model||"deepseek-chat",ctx:old.ctx!==false}]:[];
    DB.s("aicfgs",cfgs);
  }
  var PRESETS={
    "DeepSeek":"https://api.deepseek.com/v1|deepseek-chat",
    "通义千问":"https://dashscope.aliyuncs.com/compatible-mode/v1|qwen-plus",
    "月之暗面 Kimi":"https://api.moonshot.cn/v1|moonshot-v1-8k",
    "OpenAI":"https://api.openai.com/v1|gpt-4o-mini"
  };
  function getActive(){ return cfgs.filter(function(c){return c.id===window._ai.active})[0]||null; }
  function buildContext(){
    var s=["【项目进度】"];
    (S.projects||[]).forEach(function(pr){ s.push("- "+pr.name+"（客户:"+(pr.client||"-")+"，状态:"+(pr.status||"-")+(pr.result?"，成果:"+pr.result:"")+"）"); });
    s.push("【木木酱の笔记】");
    (S.notes||[]).forEach(function(n){ s.push("- ["+(n.category||"-")+"] "+n.content); });
    return s.join("\n");
  }
  function renderMsgs(){
    var box=document.getElementById("ai-msgs"); if(!box)return;
    if(!window._ai.chat.length){ box.innerHTML='<div class="ai-hint">还没有对话～ 先在右下角「⚙️ 配置」里添加一个 API 并选用，然后在这里开始聊。可让它帮你写文案、写复盘、梳理资料、答疑。</div>'; return; }
    var h="";
    window._ai.chat.forEach(function(m){
      var who=m.role==="user"?"user":"assistant";
      h+='<div class="ai-msg '+who+'"><div class="ai-bubble">'+esc(m.content||"")+'</div></div>';
    });
    box.innerHTML=h; box.scrollTop=box.scrollHeight;
  }
  function send(){
    if(window._ai.streaming) return;
    var inp=document.getElementById("ai-input"); var msg=inp.value.trim(); if(!msg)return;
    var c=getActive();
    if(!c||!c.base||!c.key){ toast("请先在右下角「⚙️ 配置」里添加并选用一个 API",3500); return; }
    window._ai.chat.push({role:"user",content:msg}); inp.value=""; renderMsgs();
    var sys="你是木木酱的 AI 工作助手，语气亲切、专业、用中文回答。";
    if(c.ctx!==false){ sys+="\n\n以下是木木酱工作台当前数据摘要（仅作上下文参考，涉及客户/金额等请保持谨慎）：\n"+buildContext(); }
    var messages=[{role:"system",content:sys}].concat(window._ai.chat.map(function(m){return {role:m.role,content:m.content};}));
    window._ai.chat.push({role:"assistant",content:""}); renderMsgs();
    window._ai.streaming=true;
    fetch((c.base||"").replace(/\/$/,"")+"/chat/completions",{
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+c.key},
      body:JSON.stringify({model:c.model||"deepseek-chat",messages:messages,stream:true})
    }).then(function(r){
      if(!r.ok) return r.text().then(function(t){throw new Error("HTTP "+r.status+" "+t.slice(0,160))});
      var reader=r.body.getReader(),dec=new TextDecoder(),buf="",full="";
      function pump(){
        return reader.read().then(function(res){
          if(res.done){ window._ai.streaming=false; DB.s("aichat",window._ai.chat); return; }
          buf+=dec.decode(res.value,{stream:true});
          var lines=buf.split("\n"); buf=lines.pop();
          for(var i=0;i<lines.length;i++){ var line=lines[i].trim(); if(line.indexOf("data:")!==0)continue; var d=line.slice(5).trim(); if(d==="[DONE]")continue;
            try{ var j=JSON.parse(d); var dl=j.choices&&j.choices[0]&&j.choices[0].delta&&j.choices[0].delta.content; if(dl){ full+=dl; window._ai.chat[window._ai.chat.length-1].content=full; renderMsgs(); } }catch(e){}
          }
          return pump();
        });
      }
      pump();
    }).catch(function(e){
      window._ai.streaming=false;
      var err="\n\n[调用失败] "+e.message+"\n（若为 CORS 跨域错误，请改用支持跨域的国内厂商如 DeepSeek / 通义 / Kimi，或在 Mac 端改用本地代理）";
      window._ai.chat[window._ai.chat.length-1].content=err; renderMsgs(); DB.s("aichat",window._ai.chat);
    });
  }
  var active=getActive();
  var selOpts='<option value="">＋ 添加 / 管理 API</option>';
  cfgs.forEach(function(c){ selOpts+='<option value="'+c.id+'"'+(c.id===window._ai.active?' selected':'')+'>'+esc(c.name||"未命名")+' · '+(c.model||"")+'</option>'; });
  var cfgBody="";
  if(window._ai.collapsed){
    cfgBody='<div class="ai-cfg-collapsed">已配置 '+cfgs.length+' 个 API'+(active?(' · 当前：'+esc(active.name||"")+'（'+esc(active.model||"")+'）'):' · 未选择，点 ⚙️ 展开配置')+'</div>';
  } else {
    if(cfgs.length){
      cfgBody+='<div class="ai-cfg-list">';
      cfgs.forEach(function(c){
        cfgBody+='<div class="ai-cfg-item'+(c.id===window._ai.active?' active':'')+'">'
          +'<div class="ai-cfg-meta"><b>'+esc(c.name||"未命名")+'</b><span>'+esc(c.model||"")+'</span>'+(c.ctx!==false?'<span class="ai-cfg-tag">带上下文</span>':'')+'</div>'
          +'<div class="ai-cfg-acts">'
          +(c.id!==window._ai.active?'<button type="button" class="btn-ghost" data-use="'+c.id+'">选用</button>':'<span class="ai-cur">✓ 当前</span>')
          +'<button type="button" class="btn-ghost" data-edit="'+c.id+'">编辑</button>'
          +'<button type="button" class="btn-ghost btn-ghost-danger" data-delcfg="'+c.id+'">✕</button>'
          +'</div></div>';
      });
      cfgBody+='</div>';
    } else {
      cfgBody+='<div class="ai-hint">还没有配置任何 API，下面添加第一个～</div>';
    }
    var presetHtml="";
    Object.keys(PRESETS).forEach(function(k){ presetHtml+='<button type="button" class="ai-preset" data-pre="'+k+'">'+k+'</button>'; });
    cfgBody+='<div class="ai-cfg-form">'
      +'<div class="ai-cfg-formtitle">添加 / 编辑 API <button type="button" class="btn-ghost" data-newcfg style="float:right">＋ 新配置</button></div>'
      +'<div class="row"><label>名称</label><input id="ai-name" placeholder="例如 DeepSeek / 我的Kimi"></div>'
      +'<div class="row"><label>Base</label><input id="ai-base" placeholder="https://api.deepseek.com/v1"></div>'
      +'<div class="row"><label>Key</label><input id="ai-key" type="password" placeholder="sk-..."></div>'
      +'<div class="row"><label>模型</label><input id="ai-model" placeholder="deepseek-chat"></div>'
      +'<div class="row"><span style="font-size:12px;color:var(--muted)">快捷填入：</span>'+presetHtml+'</div>'
      +'<div class="row"><label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="ai-ctx" checked> 带上工作台数据（项目/笔记）做上下文</label></div>'
      +'<div class="row"><button type="button" class="btn btn-sm" id="ai-save">保存 / 更新此 API</button><span class="ai-hint" id="ai-savehint"></span></div>'
      +'</div>';
  }
  var html=
    '<div class="ai-bar">'+
      '<span class="ai-bar-title">💬 hello AI</span>'+
      '<select id="ai-model-sel" class="ai-sel" title="切换模型（选择已配置的 API）">'+selOpts+'</select>'+
      '<button type="button" class="ai-cfg-toggle" id="ai-cfg-toggle">⚙️ 配置</button>'+
    '</div>'+
    '<div class="ai-msgs" id="ai-msgs"></div>'+
    '<div class="ai-input">'+
      '<textarea id="ai-input" placeholder="问点什么～ 例如：帮我把「怦怦一夏X横琴长隆」项目写成一段复盘文案"></textarea>'+
      '<button type="button" id="ai-send">发送</button>'+
      '<button type="button" class="ghost" id="ai-clear">清空</button>'+
    '</div>'+
    '<div class="ai-set'+(window._ai.collapsed?' collapsed':'')+'">'+
      '<div class="ai-set-head" id="ai-set-head"><span>⚙️ API 配置（OpenAI 兼容，仅存本机）</span><span class="ai-chev">'+(window._ai.collapsed?'▸':'▾')+'</span></div>'+
      '<div class="ai-set-body">'+cfgBody+'</div>'+
    '</div>';
  p.innerHTML=html;
  renderMsgs();
  function _on(id,ev,fn){ var el=document.getElementById(id); if(el) el.addEventListener(ev,fn); }
  _on("ai-model-sel","change",function(e){ window._ai.active=+e.target.value||null; if(window._ai.active)DB.s("aiactive",window._ai.active); rhaic(); });
  _on("ai-cfg-toggle","click",function(){ window._ai.collapsed=!window._ai.collapsed; DB.s("aicollapsed",window._ai.collapsed); rhaic(); });
  _on("ai-set-head","click",function(){ window._ai.collapsed=!window._ai.collapsed; DB.s("aicollapsed",window._ai.collapsed); rhaic(); });
  _on("ai-send","click",send);
  _on("ai-input","keydown",function(e){ if((e.metaKey||e.ctrlKey)&&e.key==="Enter"){e.preventDefault();send();} });
  _on("ai-clear","click",function(){ if(!confirm("确认清空当前对话？（配置保留）"))return; window._ai.chat=[]; DB.s("aichat",[]); renderMsgs(); });
  document.querySelectorAll("[data-pre]").forEach(function(b){ b.addEventListener("click",function(){
    var v=PRESETS[b.dataset.pre].split("|"); document.getElementById("ai-base").value=v[0]; document.getElementById("ai-model").value=v[1];
    if(!document.getElementById("ai-name").value) document.getElementById("ai-name").value=b.dataset.pre;
  }); });
  document.querySelectorAll("[data-use]").forEach(function(b){ b.addEventListener("click",function(){ window._ai.active=+b.dataset.use; DB.s("aiactive",window._ai.active); rhaic(); }); });
  document.querySelectorAll("[data-edit]").forEach(function(b){ b.addEventListener("click",function(){
    var c=cfgs.filter(function(x){return x.id===+b.dataset.edit})[0]; if(!c)return;
    window._ai.editId=+b.dataset.edit;
    document.getElementById("ai-name").value=c.name||""; document.getElementById("ai-base").value=c.base||""; document.getElementById("ai-key").value=c.key||""; document.getElementById("ai-model").value=c.model||""; document.getElementById("ai-ctx").checked=c.ctx!==false;
    document.getElementById("ai-name").focus(); toast("已载入到上方表单，改完点「保存 / 更新此 API」",2500);
  }); });
  document.querySelectorAll("[data-newcfg]").forEach(function(b){ b.addEventListener("click",function(){ window._ai.editId=null; ["ai-name","ai-base","ai-key","ai-model"].forEach(function(id){var el=document.getElementById(id); if(el)el.value="";}); document.getElementById("ai-ctx").checked=true; document.getElementById("ai-name").focus(); }); });
  document.querySelectorAll("[data-delcfg]").forEach(function(b){ b.addEventListener("click",function(){
    if(!confirm("删除该 API 配置？（对话保留）"))return;
    var id=+b.dataset.delcfg; cfgs=cfgs.filter(function(x){return x.id!==id}); DB.s("aicfgs",cfgs);
    if(window._ai.active===id){ window._ai.active=null; DB.s("aiactive",null); }
    window._ai.editId=null; rhaic();
  }); });
  var _saveBtn=document.getElementById("ai-save"); if(_saveBtn){ _saveBtn.addEventListener("click",function(){
    var name=document.getElementById("ai-name").value.trim()||"未命名";
    var base=document.getElementById("ai-base").value.trim();
    var key=document.getElementById("ai-key").value.trim();
    var model=document.getElementById("ai-model").value.trim()||"deepseek-chat";
    var ctx=document.getElementById("ai-ctx").checked;
    if(!base||!key){ toast("请填写 Base 和 Key"); return; }
    var editId=window._ai.editId||null;
    if(editId){ var c=cfgs.filter(function(x){return x.id===editId})[0]; if(c){c.name=name;c.base=base;c.key=key;c.model=model;c.ctx=ctx;} window._ai.editId=null; }
    else { var nc={id:Date.now(),name:name,base:base,key:key,model:model,ctx:ctx}; cfgs.push(nc); window._ai.active=nc.id; DB.s("aiactive",nc.id); }
    DB.s("aicfgs",cfgs);
    var h=document.getElementById("ai-savehint"); if(h){h.textContent="✅ 已保存"; setTimeout(function(){if(h)h.textContent="";},2500);}
    rhaic();
  });
  }
}
/* ================= 通用：链接快捷入口渲染 + 添加/编辑 ================= */
function hostOf(u){ try{ return new URL(u).host.replace(/^www\./,"") }catch(e){ return u } }
function favHtml(u){
  var d=hostOf(u), enc=encodeURIComponent(d);
  // 主源：duckduckgo（国内可达，0.8s 200）；iowen 不可达作 fallback
  var pri="https://icons.duckduckgo.com/ip3/"+enc+".ico";
  var sec="https://www.google.com/s2/favicons?domain="+enc+"&sz=64";
  return '<img class="link-logo" loading="lazy" referrerpolicy="no-referrer" src="'+pri+'" alt="" onerror="favFallback(this,\x27'+sec+'\x27)">';
}
window.favFallback=function(img,sec){
  if(!img.dataset.tried){img.dataset.tried=1;img.src=sec;}
  else{var s=document.createElement("span");s.className="link-logo link-logo-emoji";s.textContent="🌐";if(img.parentNode)img.parentNode.replaceChild(s,img);}
};
function renderLinks(panelId,key,list,opt){
  var wrapCls=opt.fun?"links-wrap links-fun":"links-wrap";
  var addCls=opt.fun?"btn btn-pink btn-sm":"btn btn-primary btn-sm";
  var html='<div class="'+wrapCls+'">';
  if(opt.subtitle)html+='<div class="links-sub">'+esc(opt.subtitle)+'</div>';
  html+='<div class="row mb-12"><button class="'+addCls+'" id="add-'+key+'-btn">'+opt.addLabel+'</button>';
  if(opt.fun)html+='<img class="mametchi mametchi-fun" src="assets/mametchi.png" alt="麻美吉">';
  html+='</div>';
  if(!list.length){ html+='<div class="empty">还没有添加，点上面按钮加一个吧～</div>'; }
  else{
    html+='<div class="links-grid">'+orderItems(list,key,function(it){return it.id}).map(function(it){
      return '<div class="drag-item link-card" data-drag-id="'+it.id+'">'
        +'<div class="link-top">'+favHtml(it.url)
        +'<a class="link-badge" href="'+esc(it.url)+'" target="_blank" rel="noopener" title="'+esc(it.url)+'">'+esc(it.name||"未命名")+'</a></div>'
        +'<a class="link-url" href="'+esc(it.url)+'" target="_blank" rel="noopener" title="'+esc(it.url)+'">'+esc(it.url)+'</a>'
        +'<div class="link-acts"><button class="btn-ghost sh0" data-edit="'+it.id+'">编辑</button><button class="btn-ghost btn-ghost-danger sh0" data-del="'+it.id+'">✕</button></div>'
        +'</div>';
    }).join("")+'</div>';
  }
  html+='</div>';
  var p=document.getElementById(panelId);
  p.innerHTML=html;
  bindDrag(panelId,key);
  document.getElementById("add-"+key+"-btn").addEventListener("click",function(){linkModal(key,null)});
  p.querySelectorAll("[data-edit]").forEach(function(b){b.addEventListener("click",function(){linkModal(key,+b.dataset.edit)})});
  p.querySelectorAll("[data-del]").forEach(function(b){
    b.addEventListener("click",function(){
      if(!confirm("确定删除？"))return;
      var delItem=S[key].find(function(x){return x.id===+b.dataset.del});
      if(delItem) tombstone(key, mergeKey(key, delItem));
      S[key]=S[key].filter(function(x){return x.id!==+b.dataset.del});S.save();renderLinks(panelId,key,S[key],opt);
    });
  });
}
function linkModal(key,id){
  var it=id?S[key].find(function(x){return x.id===id}):null;
  var kind=key==="fun"?"好玩的":"工具";
  omod('<h3>'+(it?"编辑":"添加")+kind+'</h3>'
    +'<div class="fg"><label>名称（显示前缀）</label><input id="lk-name" value="'+(it?esc(it.name||""):"")+'" placeholder="例如 NotebookLM / YouTube"></div>'
    +'<div class="fg"><label>网址</label><input id="lk-url" value="'+(it?esc(it.url):"")+'" placeholder="https://..."></div>'
    +'<div class="row row-end gap-4 mt-12"><button class="btn" id="lkc">取消</button><button class="btn btn-primary" id="lks">保存</button></div>');
  bindModal("lkc","lks",function(){
    var n=document.getElementById("lk-name").value.trim(),u=document.getElementById("lk-url").value.trim();
    if(!u){toast("请填写网址");return}
    if(!/^https?:\/\//i.test(u))u="https://"+u;
    var data={name:n||hostOf(u),url:u};
    if(it){Object.assign(it,data)}else{data.id=S.nid(S[key]);S[key].push(data)}
    S.save();cmod();
    if(key==="aitool")rai();else rfn();
  });
}

})();
</script>
